name: Cloudflare Worker Preview Deploy

on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/cloudflare-web-preview.yml'
      - '.github/actions/setup/**'
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/cloudflare-web-preview.yml'
      - '.github/actions/setup/**'
  issue_comment:
    types: [created]

concurrency:
  group: cloudflare-worker-preview-${{ github.event.pull_request.number || github.event.issue.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy' &&
      (github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'release') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate and resolve deployment metadata
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let headSha = context.sha;
            let number = '';
            let alias = '';
            let isPr = 'false';

            if (context.eventName === 'pull_request') {
              const pullRequest = context.payload.pull_request;
              headSha = pullRequest.head.sha;
              number = String(pullRequest.number);
              alias = `pr-${pullRequest.number}`;
              isPr = 'true';
            } else if (context.eventName === 'issue_comment') {
              if (!context.payload.issue?.pull_request) {
                core.setFailed('The comment is not on a pull request.');
                return;
              }

              const { owner, repo } = context.repo;
              const { data: pullRequest } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.issue.number,
              });

              if (pullRequest.state !== 'open') {
                core.setFailed('The pull request must be open.');
                return;
              }

              const head = pullRequest.head;
              if (!head?.sha || !head.ref || !head.repo?.full_name) {
                core.setFailed('The pull request head is missing or deleted.');
                return;
              }
              if (head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
                core.setFailed('Fork pull request heads cannot be deployed.');
                return;
              }
              if (head.ref === 'release') {
                core.setFailed('Release pull request heads cannot be deployed.');
                return;
              }

              headSha = head.sha;
              number = String(pullRequest.number);
              alias = `pr-${pullRequest.number}`;
              isPr = 'true';
            } else {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              alias = branch.toLowerCase()
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            }

            if (!headSha) {
              core.setFailed('Unable to resolve an immutable deployment SHA.');
              return;
            }

            core.setOutput('head_sha', headSha);
            core.setOutput('number', number);
            core.setOutput('alias', alias);
            core.setOutput('is_pr', isPr);

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          persist-credentials: false

      - name: Prepare preview metadata
        id: metadata
        shell: bash
        run: |
          preview_message="$(git log -1 --pretty=%s)"
          preview_message="$(printf '%s' "$preview_message" | head -c 100)"

          {
            echo 'preview_message<<EOF'
            echo "$preview_message"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set Sentry build environment for PR preview
        if: steps.resolve.outputs.is_pr == 'true'
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        shell: bash
        run: |
          echo "VITE_SENTRY_DSN=$VITE_SENTRY_DSN" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_ENVIRONMENT=preview" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_PR=${{ steps.resolve.outputs.number }}" >> "$GITHUB_ENV"
          echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "SENTRY_ORG=$SENTRY_ORG" >> "$GITHUB_ENV"
          echo "SENTRY_PROJECT=$SENTRY_PROJECT" >> "$GITHUB_ENV"

      - name: Setup app and build
        uses: ./.github/actions/setup
        with:
          build: 'true'

      - name: Upload Worker preview
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          PREVIEW_MESSAGE: ${{ steps.metadata.outputs.preview_message }}
        with:
          apiToken: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.TF_VAR_ACCOUNT_ID }}
          command: >
            versions upload
            -c dist/wrangler.json
            --preview-alias ${{ steps.resolve.outputs.alias }}
            --message "$PREVIEW_MESSAGE"

      - name: Resolve preview URL
        id: preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          ALIAS: ${{ steps.resolve.outputs.alias }}
        shell: bash
        run: |
          alias_url_pattern="^https?://${ALIAS}-[^[:space:]]+$"
          preview_url=""

          if printf '%s\n' "$DEPLOYMENT_URL" | grep -Eq "$alias_url_pattern"; then
            preview_url="$DEPLOYMENT_URL"
          else
            preview_url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo "https?://${ALIAS}-[^[:space:]\"'<>)]+" | head -n 1 || true)"
          fi

          if ! printf '%s\n' "$preview_url" | grep -Eq "$alias_url_pattern"; then
            echo "Failed to resolve aliased Worker preview URL." >&2
            exit 1
          fi

          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Publish summary and PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MARKER: '<!-- cloudflare-worker-preview -->'
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_ALIAS: ${{ steps.resolve.outputs.alias }}
          SHORT_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = process.env.MARKER;
            const previewUrl = process.env.PREVIEW_URL;
            const previewAlias = process.env.PREVIEW_ALIAS;
            const shortSha = process.env.SHORT_SHA?.slice(0, 7);
            const now = new Date().toUTCString().replace(':00 GMT', ' UTC');

            if (!previewUrl) {
              core.setFailed("Missing preview URL from Cloudflare deploy step.");
              return;
            }

            const tableRow = "| ✅ Deployment successful! | <a href='" + previewUrl + "'>" + previewUrl + "</a> | " + shortSha + " | `" + previewAlias + "` | " + now + " |";
            const comment = [
              marker,
              `## Deploying with &nbsp;<a href="https://workers.dev"><img alt="Cloudflare Workers" src="https://workers.cloudflare.com/logo.svg" width="16"></a> &nbsp;Cloudflare Workers`,
              ``,
              `| Status | Preview URL | Commit | Alias | Updated (UTC) |`,
              `| - | - | - | - | - |`,
              tableRow,
            ].join("\n");

            await core.summary.addRaw(comment.replace(marker + "\n", "")).write();

            if (!['pull_request', 'issue_comment'].includes(context.eventName)) return;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id,
              });
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
