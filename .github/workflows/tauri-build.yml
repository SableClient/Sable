name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach desktop bundles to (e.g. v1.20.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: tauri-build-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            rust-targets: ''
            args: ''
          - name: Linux (CEF)
            platform: ubuntu-22.04
            rust-targets: ''
            cef: true
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=8192
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Wait for release to exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              exit 0
            fi
            echo "Waiting for release $TAG to be published ($i/12)…"
            sleep 15
          done
          echo "Release $TAG was not found." >&2
          exit 1

      - name: Install Linux build dependencies
        if: matrix.cef
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            rpm \
            ruby \
            ruby-dev
          sudo gem install --no-document fpm

      - name: Setup app
        uses: ./.github/actions/setup

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Stamp release version into tauri.conf.json
        shell: bash
        run: node .github/scripts/set-tauri-version.mjs "${TAG#v}"

      # --- macOS / Windows: standard wry build via tauri-action ---
      - name: Build desktop bundles
        id: tauri
        if: ${{ !matrix.cef }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: ${{ matrix.args }}

      - name: Attach bundles to release
        if: ${{ !matrix.cef }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACTS" | jq -r '.[]' | while read -r path; do
            [ -n "$path" ] || continue
            echo "Uploading $path"
            gh release upload "$TAG" "$path" --clobber
          done

      # --- Linux: CEF runtime, packaged as deb / rpm / AppImage ---
      - name: Build frontend
        if: matrix.cef
        shell: bash
        run: pnpm build

      - name: Build CEF binary
        if: matrix.cef
        shell: bash
        run: |
          cargo build --release --features cef --no-default-features \
            --manifest-path src-tauri/Cargo.toml

      - name: Build native packages
        if: matrix.cef
        shell: bash
        run: bash scripts/cef-package.sh "${TAG#v}"

      - name: Sign the AppImage for the updater
        if: ${{ matrix.cef && env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/appimage/Sable_*_amd64.AppImage; do
            [ -e "$f" ] || continue
            pnpm tauri signer sign "$f"
          done

      - name: Attach native packages to release
        if: matrix.cef
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          for f in "$BUNDLE"/deb/sable_*.deb "$BUNDLE"/rpm/sable-*.rpm \
                   "$BUNDLE"/appimage/Sable_*_amd64.AppImage \
                   "$BUNDLE"/appimage/Sable_*_amd64.AppImage.sig; do
            [ -e "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  updater-manifest:
    name: Publish updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/build-updater-manifest.mjs
          gh release upload "$TAG" latest.json --clobber
