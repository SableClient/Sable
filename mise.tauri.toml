# Tauri-specific dev tools and system dependencies.
# Loaded via `MISE_ENV=tauri` (set by `mise run setup:tauri` or CI).

[settings]
idiomatic_version_file_enable_tools = ["pnpm", "node", "rust"]
experimental = true

[tools]
# Android
java = "temurin-21"
android-sdk = "22.0"

[bootstrap.packages]
# Debian/Ubuntu
"apt:build-essential" = "latest"
"apt:file" = "latest"
"apt:libayatana-appindicator3-dev" = "latest"
"apt:libgtk-3-dev" = "latest"
"apt:librsvg2-dev" = "latest"
"apt:libsoup-3.0-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:libwebkit2gtk-4.1-dev" = "latest"
"apt:libxdo-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"

# Fedora/RHEL
"dnf:webkit2gtk4.1-devel" = "latest"
"dnf:openssl-devel" = "latest"
"dnf:libappindicator-gtk3-devel" = "latest"
"dnf:librsvg2-devel" = "latest"
"dnf:libxdo-devel" = "latest"
"dnf:curl" = "latest"
"dnf:wget" = "latest"
"dnf:file" = "latest"

# Arch
"pacman:webkit2gtk-4.1" = "latest"
"pacman:base-devel" = "latest"
"pacman:openssl" = "latest"
"pacman:librsvg" = "latest"
"pacman:xdotool" = "latest"
"pacman:curl" = "latest"
"pacman:wget" = "latest"
"pacman:file" = "latest"

# Alpine
"apk:webkit2gtk-4.1-dev" = "latest"
"apk:build-base" = "latest"
"apk:openssl" = "latest"
"apk:libayatana-appindicator-dev" = "latest"
"apk:librsvg" = "latest"
"apk:curl" = "latest"
"apk:wget" = "latest"
"apk:file" = "latest"

# macOS
"brew:curl" = "latest"
"brew:wget" = "latest"

# iOS
"brew:cocoapods" = "latest"
