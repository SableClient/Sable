[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
idiomatic_version_file_enable_tools = ["pnpm", "node", "rust"]
experimental = true

[task_config]
includes = ["scripts"]

[tasks.dev]
description = "Start Vite dev server"
alias = "d"
run = "vite dev"
raw = true

[tasks.build]
description = "Build frontend with Vite"
alias = "b"
run = "vite build"

[tasks.preview]
description = "Preview the production build"
alias = "p"
run = "vite preview"

[tasks.lint]
description = "Run all linting, typechecking, formatting, and dead code checks"
alias = "l"
run = ["tsc", "oxlint .", "oxfmt --check .", "knip"]

[tasks.lint-fix]
description = "Fix lint issues, format, and run typecheck and dead code checks"
alias = "lf"
run = ["oxlint . --fix", "oxfmt .", "knip --fix"]

[tasks.test]
description = "Run tests"
alias = "t"
run = "vitest"
raw = true

[tasks.document-change]
description = "Document a change with knope"
alias = "doc"
run = "knope document-change"

[tasks."cargo:lint"]
description = "Check Rust formatting and lint with Clippy"
alias = ["cl", "cargo-lint"]
dir = "src-tauri"
run = ["cargo fmt --check", "cargo clippy --all-targets --all-features -- -D warnings"]

[tasks."cargo:lint-fix"]
description = "Fix Rust formatting and lint issues"
alias = ["clf", "cargo-lint-fix"]
dir = "src-tauri"
run = ["cargo fmt", "cargo clippy --fix --allow-dirty --all-targets --all-features -- -D warnings"]

[tasks."cargo:test"]
description = "Run Rust tests"
alias = ["ct", "cargo-test"]
dir = "src-tauri"
run = "cargo test"
raw = true
