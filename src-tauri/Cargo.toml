[package]
name = "sable"
version = "1.22.0"
description = "Yet another matrix client but better"
authors = ["Sable Maintainers"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/SableClient/Sable"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.6.3", features = [] }
tauri-typegen = "0.5"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# default-features = false drops reqwest + native-tls (openssl); ureq is a sync
# rustls transport with no async-runtime dependency.
sentry = { version = "0.49.0", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "ureq",
] }
tokio = { version = "1", features = ["time", "sync", "fs", "io-util"] }
ts-rs = "12.0.0"
sha2 = "0.11"
aes = "0.9"
ctr = "0.10"
infer = { version = "0.22", default-features = false }
percent-encoding = "2"
# Enables `stream` (for native_upload's `Body::wrap_stream`) on the reqwest that
# tauri-plugin-http pulls in without it. default-features = false keeps
# openssl-sys out of the Android cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
async-stream = "0.3"
base64 = "0.23"
zeroize = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
regex = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

tauri = { version = "2.11.5", default-features = false, features = [
  "tray-icon",
  "dynamic-acl",
  "compression",
  "x11",
  "common-controls-v6",
  "dbus",
  "image-png",
] }

# Rust Matrix crypto engine. Optional so regular builds don't pay the
# matrix-rust-sdk compile cost.
matrix-sdk = { version = "0.18", default-features = false, features = [
  "e2e-encryption",
  "sqlite",
], optional = true }
# `qrcode` is off by default upstream; Sable already supports QR device
# verification, so the engine needs it for parity with the wasm backend.
matrix-sdk-crypto = { version = "0.18", features = [
  "qrcode",
  "automatic-room-key-forwarding",
  "experimental-push-secrets",
], optional = true }
# `bundled` compiles SQLite from source. Android's NDK ships no libsqlite3 to link
# against at any API level, so without this the aarch64 build fails at link time.
matrix-sdk-sqlite = { version = "0.18", features = ["crypto-store", "bundled"], optional = true }
http = { version = "1", optional = true }

tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-http = "2.5.9"
tauri-plugin-store = "2.4.4"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"

# Debug-only in practice: only initialized under #[cfg(debug_assertions)] in
# lib.rs, so the release build never calls into it.
# default-features = false drops the plugin's `wry` feature (which enables
# `tauri/wry`); Sable's own `wry` feature already enables `tauri/wry` for wry
# builds, and CEF builds (--no-default-features --features cef) must not pull
# wry/tauri-runtime-wry/webkit2gtk.
# Pinned to =2.0.0 because 2.1.0+ introduced an unconditional call to
# tauri::webview_version() which is gated behind tauri's `wry` feature.
tauri-plugin-devtools = { version = "=2.1.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-notifications = { git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "758156fd9b1cbc99c83062194a2a59c411b5907f" }

# default-features = false drops notify-rust so macOS uses the native
# UNUserNotificationCenter backend (needs a signed .app to deliver).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notifications = { git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "758156fd9b1cbc99c83062194a2a59c411b5907f", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"
# Used directly in lib.rs for WebKitGTK permission handling (wry only).
# Optional + gated via the `wry` feature so CEF builds don't pull it.
webkit2gtk = { version = "2.0", optional = true, features = ["v2_34"] }

# CEF (Chromium) runtime — Linux only; other platforms use wry.
# Fork of tauri's unreleased feat/cef branch, ported onto published crates.
# https://github.com/SableClient/tauri-runtime-cef
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { git = "https://github.com/SableClient/tauri-runtime-cef", rev = "eace83edf055acc17e811b2bc75d4b6eadf39670", optional = true }
cef = { version = "=150.2.1", optional = true }
libloading = "0.9"
zbus = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notifications = { git = "https://github.com/SableClient/tauri-plugin-notifications.git", rev = "758156fd9b1cbc99c83062194a2a59c411b5907f", features = [
  "push-notifications",
] }
tauri-plugin-edge-to-edge = { git = "https://github.com/SableClient/tauri-plugin-edge-to-edge.git", rev = "33c6116c27be28c06df5a9d02231ecc5fdeb93c5" }
tauri-plugin-sharekit = { git = "https://github.com/Choochmeque/tauri-plugin-sharekit", rev = "9f2b4c5d8a4f0ab910d900ba234ed8bae0ab854b" }
tauri-plugin-app-icon = { git = "https://github.com/SableClient/tauri-plugin-app-icon", rev = "bab80ae17f6d018702e472c539d0f02eba480c21" }
tauri-plugin-livekit-mobile = { git = "https://github.com/SableClient/tauri-plugin-livekit-mobile.git", rev = "c6f0d02ab3da1174535bc1dc8e598a2e6873f977" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
  "NSUUID",
] }
objc2-photos = { version = "0.3.2", default-features = false, features = [
  "std",
  "PHPhotoLibrary",
  "PHChangeRequest",
  "PHAssetChangeRequest",
  "PHAssetCreationRequest",
  "PhotosTypes",
  "bitflags",
  "block2",
  "dispatch2",
] }
block2 = "0.6"
tauri-plugin-fs = "2"
objc2-avf-audio = { version = "0.3", default-features = false, features = [
  "AVAudioSession",
  "AVAudioSessionTypes",
] }
objc2-call-kit = { version = "0.3", default-features = false, features = [
  "std",
  "alloc",
  "block2",
  "dispatch2",
  "CXAction",
  "CXProvider",
  "CXProviderConfiguration",
  "CXCallUpdate",
  "CXHandle",
  "CXCall",
  "CXCallAction",
  "CXStartCallAction",
  "CXEndCallAction",
  "CXSetMutedCallAction",
  "CXTransaction",
  "CXCallController",
] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "=29.0.0", features = ["legacy-storage-permission"] }
jni = "0.22"

[features]
default = ["wry", "updater", "matrix-crypto"]
custom-protocol = ["tauri/custom-protocol"]
wry = ["tauri/wry", "dep:webkit2gtk"]
# Tauri auto-updater. Disable with --no-default-features --features wry,cef.
updater = ["dep:tauri-plugin-updater"]
# CEF (Chromium) runtime. Build with --no-default-features --features cef.
cef = ["dep:tauri-runtime-cef", "dep:cef"]
# CrabNebula devtools. Off by default: its aggregator retains every metadata record for the
# session, which costs hundreds of MB per minute once tauri-plugin-log feeds it.
devtools = ["dep:tauri-plugin-devtools"]
matrix-crypto = ["dep:matrix-sdk", "dep:matrix-sdk-crypto", "dep:matrix-sdk-sqlite", "dep:http"]
[patch.crates-io]
tauri-typegen = { git = "https://github.com/SableClient/tauri-typegen", branch = "fix/nondeterministic-generation-cache" }

# To test unreleased tauri features
# tauri = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-plugin = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }
# tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "dev" }

