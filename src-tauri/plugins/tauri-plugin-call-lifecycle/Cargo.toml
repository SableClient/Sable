[package]
name = "tauri-plugin-call-lifecycle"
version = "0.1.0"
authors = [ "Sable Contributors" ]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-call-lifecycle"

[dependencies]
tauri = { version = "2.11.3", default-features = false }
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
