[package]
name = "tauri-plugin-call-lifecycle"
version = "0.1.0"
authors = [ "Sable Contributors" ]
description = ""
edition = "2021"
rust-version = "1.97"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-call-lifecycle"

[dependencies]
tauri = { version = "2.11.3", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }
serde = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
tauri = { version = "2.11.3", default-features = false, features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["tokio", "screencast"] }
cpal = "0.15"
futures-util = "0.3"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l", "decoding"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation", "decoding"] }
screencapturekit = { version = "8.0.1", features = ["async"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf", "decoding"] }
raw-window-handle = "0.6"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_DirectX",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
] }
windows-future = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
